name: python ci 

on:
    push:
        branches: [ main]


jobs:
    Build-test:
        runs-on: ubuntu-latest

        steps:

            - name: checkout the code 
              uses: actions/checkout@v4

            - name: setting up python for app.py 
              uses: actions/setup-python@v5
              with:
                python-version: "3.10"

            - name: install dependencies
              run: |
                python -m pip install --upgrade pip 
                pip install pytest 

            - name: run the test
              run: pytest -v 

            - name: package application
              run: |
                 mkdir build 
                 cp app.py && test_app.py build/
                 echo "build process has been completed"

            - name: upload the artifact
              uses: actions/upload-artifact@v4
              with: 
                name: python-app
                path: build/