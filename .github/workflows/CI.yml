name: python ci 

on:
    push:
        branches: [ main]


jobs:
    Build-test:
        runs-on: ubuntu-latest

        steps:

            - name: checkout the code 
              uses: actions/checkout@v4

            - name: setting up python for app.py 
              uses: actions/settup-python@v5
              with:
                python-version: "3.10"

            - name: install dependencies
              run: |
                python -m pip install --upgrade pip 
                pip install pytest 

            - name:
              run: pytest -v 

